spring:
  application:
    name: evd-sys-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/evd_sys}
    username: ${DB_USERNAME:evd_user}
    password: ${DB_PASSWORD:evd_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

server:
  error:
    include-message: never

app:
  jwt:
    secret: ${JWT_SECRET:c3VwZXItc2VjdXJlLWRldmVsb3BtZW50LWp3dC1rZXktYXQtbGVhc3QtMzItYnl0ZXM=}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  file-storage:
    upload-dir: ${UPLOAD_DIR:uploads}
